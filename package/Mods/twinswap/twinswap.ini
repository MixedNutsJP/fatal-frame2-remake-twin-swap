; TwinSwap - settings / 設定
;
; Main = the look of the character you control (Mio in the story)
;        操作キャラ（本編の澪）の見た目
; Sub  = the look of the companion (Mayu in the story)
;        同行キャラ（本編の繭）の見た目
; Values / 値: mio | mayu | sae | yae
;   mio = Mio / 澪, mayu = Mayu / 繭, sae = Sae / 紗重, yae = Yae / 八重
;
;   Main=mayu, Sub=mio   ... swap the twins (default) / 姉妹を入れ替える（既定）
;   Main=mayu, Sub=mayu  ... two Mayus / 二人とも繭
;   Main=mio,  Sub=mio   ... two Mios / 二人とも澪
;   Main=mio,  Sub=mayu  ... vanilla / 元のまま
;   Main=sae,  Sub=yae   ... play as Sae with Yae / 紗重を操作して八重を連れて歩く
;
; Sae and Yae have a single outfit; every costume shows it (except Mio's 8th).
; 紗重・八重は 1 着だけで、どの衣装を選んでもその姿になります（澪の 8 着目を除く）。
;
; Changes take effect the next time you start the game.
; 変更はゲームの次回起動時に反映されます。

[Swap]
Main=mayu
Sub=mio
; Red rope of Sae and Yae: 1 = show (default), 0 = hide (it may clip through the kimono)
; 紗重・八重の赤い縄: 1 = 表示（既定）、0 = 非表示（歩くと着物を突き抜けることがあります）
Rope=1
; Blindfold on Mio's 2nd costume (summer cardigan), high-detail model:
;   default = as the game does, show = always shown, hide = never shown
; 澪の 2 着目（夏のカーディガン）の目隠し（高精細モデル）:
;   default = ゲームのまま、show = 常に表示、hide = 常に非表示
Blindfold=default

[General]
; 0 turns the mod off without uninstalling it / 0 でアンインストールせずに無効化
Enabled=1
; 1 writes twinswap.log next to this file / 1 でこのフォルダに twinswap.log を書く
Log=1
