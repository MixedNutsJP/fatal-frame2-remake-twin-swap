; TwinSwap - settings / 設定
; Edit the values below, then restart the game. What each one means is explained
; at the bottom of this file.
; 下の値を書き換えて、ゲームを再起動してください。各項目の意味は、このファイルの
; 末尾にまとめてあります。

[Swap]
Main=mayu
Sub=mio
Rope=1
Blindfold=default
ChitoseSkin=default
SaeYaeSkin=default
MioSkin=default
MayuSkin=default

[General]
Enabled=1
Log=1

; ======================================================================
;  Explanation / 説明   (nothing below this line is a setting)
;                       （ここから下は説明で、設定ではありません）
; ======================================================================
;
; Main = the look of the character you control (Mio in the story)
;        操作キャラ（本編の澪）の見た目
; Sub  = the look of the companion (Mayu in the story)
;        同行キャラ（本編の繭）の見た目
;   Values / 値: mio | mayu | sae | yae | chitose | miyako
;     mio = Mio / 澪, mayu = Mayu / 繭, sae = Sae / 紗重, yae = Yae / 八重,
;     chitose = Chitose / 千歳, miyako = Miyako / 美也子
;   Examples / 例:
;     Main=mayu, Sub=mio     the twins swapped (default) / 姉妹を入れ替える（既定）
;     Main=mayu, Sub=mayu    two Mayus / 二人とも繭
;     Main=mio,  Sub=mio     two Mios / 二人とも澪
;     Main=mio,  Sub=mayu    vanilla / 元のまま
;     Main=sae,  Sub=yae     play as Sae with Yae / 紗重を操作して八重を連れて歩く
;     Main=chitose, Sub=mayu play as Chitose with Mayu / 千歳を操作して繭を連れて歩く
;   Sae, Yae, Chitose and Miyako have a single outfit; every costume shows it
;   (except Mio's 8th).
;   紗重・八重・千歳・美也子は 1 着だけで、どの衣装を選んでもその姿になります
;   （澪の 8 着目を除く）。
;
; Rope = the red rope of Sae and Yae
;        紗重・八重の赤い縄
;   1 = show (default; it may clip through the kimono) / 表示（既定。着物を突き抜けることがあります）
;   0 = hide / 非表示
;
; Blindfold = the white blindfold on Mio's 2nd costume (summer cardigan), high-detail model
;             澪の 2 着目（夏のカーディガン）の白い目隠し（高精細モデル）
;   default = as the game does / ゲームのまま
;   show    = always shown / 常に表示
;   hide    = never shown / 常に非表示
;
; ChitoseSkin = the skin of Chitose
;               千歳の肌
;   default = as the game does (pale, a ghost) / ゲームのまま（幽霊の白い肌）
;   human   = a living skin tone / 生きている人の肌色
;
; SaeYaeSkin = the skin of Sae and Yae
;              紗重・八重の肌
;   default = as the game does (alive) / ゲームのまま（生前の肌色）
;   ghost   = a pale ghost's skin / 幽霊の白い肌
;
; MioSkin / MayuSkin = the skin of Mio / Mayu
;                      澪・繭の肌
;   default = as the game does / ゲームのまま
;   ghost   = a pale ghost's skin, only in some costumes:
;             Mio's 4th, 6th, 7th and 8th, Mayu's 2nd, 6th and 7th
;             (Mayu's 6th is the blood-stained white kimono)
;             幽霊の白い肌。対象は一部の衣装だけです:
;             澪の 4・6・7・8 着目、繭の 2・6・7 着目
;             （繭の 6 着目が、血の付いた白い着物です）
;
;   The skin settings apply to the character, not to Main or Sub: with two Chitoses,
;   both get the same skin.
;   肌の設定はキャラごとで、Main / Sub ごとではありません。二人とも千歳にした場合は、
;   二人とも同じ肌になります。
;
; Enabled = 0 turns the mod off without uninstalling it
;           0 にすると、アンインストールせずに無効化できます
; Log     = 1 writes twinswap.log next to this file
;           1 にすると、このフォルダに twinswap.log を書きます
